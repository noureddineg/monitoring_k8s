alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: webhook-logger
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
      - receiver: 'null'
        matchers:
        - alertname = "Watchdog"
    receivers:
    - name: 'null'
    - name: webhook-logger
      webhook_configs:
      - url: 'http://webhook-logger.monitoring.svc:8080/'
        send_resolved: true